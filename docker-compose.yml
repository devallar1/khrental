services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khrental-web
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-5174}:5174"
    env_file:
      - .env.docker
    environment:
      PORT: 5174
      NODE_ENV: production
      PG_HOST: postgres
      PG_PORT: 5432
      VITE_API_ENDPOINT: ${WEB_PUBLIC_URL:-http://localhost:5174}
      VITE_APP_BASE_URL: ${WEB_PUBLIC_URL:-http://localhost:5174}
      VITE_USE_MSSQL_API: "true"
      VITE_ENABLE_DEV_BYPASS: ${VITE_ENABLE_DEV_BYPASS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - khrental_storage:/app/public/storage
    networks:
      - khrental-network

  postgres:
    image: postgres:16-alpine
    container_name: khrental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-khrental}
      POSTGRES_USER: ${PG_USER:-khrental}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${PG_USER:-khrental} -d ${PG_DATABASE:-khrental}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - khrental-network

volumes:
  pg_data:
  khrental_storage:

networks:
  khrental-network:
    driver: bridge
